# Start with:  docker compose up -d --build
# Dashboard:   http://localhost:52773/carebridge/index.html
services:
  iris:
    build:
      context: .
      args:
        IRIS_IMAGE: ${IRIS_IMAGE:-irishealth-community:2027.1.0AI.109.0}
    image: carebridge-ai:local
    container_name: carebridge-iris
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # REPLAY needs no model or key. LIVE calls the real AI Hub agent (see .env.example).
      CAREBRIDGE_AGENT_MODE: ${CAREBRIDGE_AGENT_MODE:-REPLAY}
    extra_hosts:
      # Lets a local OpenAI-compatible model server on the host (LM Studio, Ollama) be reached as host.docker.internal.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:52773:52773"   # dashboard, REST API and Management Portal (localhost only)
      - "127.0.0.1:1972:1972"     # superserver (localhost only)
      - "127.0.0.1:7010:7010"     # HIS MLLP (ADT/ORM)
      - "127.0.0.1:7011:7011"     # LIS MLLP (ORU)
    volumes:
      # CareBridge database, EMR inbox and quarantine copies survive container re-creation.
      - carebridge-data:/home/irisowner/carebridge
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/52773 && printf \"GET /api/carebridge/health HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"productionRunning\\\":1\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
volumes:
  carebridge-data:
